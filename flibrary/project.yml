name: flibrary
options:
  bundleIdPrefix: com.cycling
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGNING_ALLOWED: "NO"
targets:
  flibrary:
    type: application
    platform: macOS
    sources:
      - path: App
      - path: ../editor/ReelsEditor/SphereMath.swift
      # shared v360 math, referenced not copied
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cycling.flibrary
        PRODUCT_NAME: flibrary
        INFOPLIST_KEY_CFBundleDisplayName: flibrary
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.video
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_ALLOWED: "YES"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: "NO"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSHighResolutionCapable: YES
        ENABLE_APP_SANDBOX: NO
        SWIFT_STRICT_CONCURRENCY: complete
  flibraryTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: flibrary
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cycling.flibraryTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/flibrary.app/Contents/MacOS/flibrary"
        BUNDLE_LOADER: "$(TEST_HOST)"
        SWIFT_STRICT_CONCURRENCY: complete
schemes:
  flibrary:
    build:
      targets:
        flibrary: all
        flibraryTests: [test]
    test:
      targets:
        - flibraryTests
