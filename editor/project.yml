name: ReelsEditor
options:
  bundleIdPrefix: com.cycling
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGNING_ALLOWED: "NO"
targets:
  ReelsEditor:
    type: application
    platform: macOS
    sources:
      - path: ReelsEditor
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cycling.ReelsEditor
        PRODUCT_NAME: "Reels Editor"
        PRODUCT_MODULE_NAME: ReelsEditor
        INFOPLIST_KEY_CFBundleDisplayName: "Reels Editor"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.video
        INFOPLIST_KEY_NSAppleEventsUsageDescription: "Reels Editor opens Terminal to start Claude Code in your cycling folder."
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_ALLOWED: "YES"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: "NO"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        INFOPLIST_KEY_NSHighResolutionCapable: YES
        ENABLE_APP_SANDBOX: NO
        SWIFT_STRICT_CONCURRENCY: complete
  ReelsEditorTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: ReelsEditorTests
    dependencies:
      - target: ReelsEditor
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cycling.ReelsEditorTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Reels Editor.app/Contents/MacOS/Reels Editor"
        BUNDLE_LOADER: "$(TEST_HOST)"
        SWIFT_STRICT_CONCURRENCY: complete
schemes:
  ReelsEditor:
    build:
      targets:
        ReelsEditor: all
        ReelsEditorTests: [test]
    test:
      targets:
        - ReelsEditorTests
