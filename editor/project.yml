name: ReelsEditor
options:
  bundleIdPrefix: com.cycling
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGNING_ALLOWED: "NO"
targets:
  ReelsEditor:
    type: application
    platform: macOS
    sources:
      - path: ReelsEditor
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cycling.ReelsEditor
        PRODUCT_NAME: ReelsEditor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        INFOPLIST_KEY_NSHighResolutionCapable: YES
        ENABLE_APP_SANDBOX: NO
        SWIFT_STRICT_CONCURRENCY: complete
  ReelsEditorTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: ReelsEditorTests
    dependencies:
      - target: ReelsEditor
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cycling.ReelsEditorTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/ReelsEditor.app/Contents/MacOS/ReelsEditor"
        BUNDLE_LOADER: "$(TEST_HOST)"
        SWIFT_STRICT_CONCURRENCY: complete
schemes:
  ReelsEditor:
    build:
      targets:
        ReelsEditor: all
        ReelsEditorTests: [test]
    test:
      targets:
        - ReelsEditorTests
